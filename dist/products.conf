
# ================= 产品宣传页（生成物：prodsites/build.js + emit-conf.js）=================
# 每个产品一个静态目录 /var/www/<host>/index.html；证书复用 *.yxpil.com 的 Origin CA 证书。
# 文案全部来自仓库自身的 description / release / 文档路径，不写死任何实际工作任务。
# 未发布过二进制产物的站点没有 /download，页面按钮直接指向仓库。

# ---- maylin (release v0.2.0) ----
server {
    listen 80;
    server_name maylin.yxpil.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name maylin.yxpil.com;
    ssl_certificate     /opt/selfhost/certs/yxpil.com/fullchain.pem;
    ssl_certificate_key /opt/selfhost/certs/yxpil.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/maylin.yxpil.com;
    index index.html;
    expires 1h;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /download {
        return 302 https://github.com/yxpil/maylin/releases/latest;
    }

    location = /docs {
        return 302 https://github.com/yxpil/maylin/blob/main/README.md;
    }

    location / {
    }
}

